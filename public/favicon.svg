<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" fill="none">
  <!-- Background circle -->
  <circle cx="32" cy="32" r="32" fill="#064e3b"/>

  <!-- Wheat stalks (left) -->
  <line x1="12" y1="48" x2="12" y2="34" stroke="#d4a017" stroke-width="1.5" stroke-linecap="round"/>
  <ellipse cx="12" cy="31" rx="2.5" ry="4" fill="#d4a017" transform="rotate(-15 12 31)"/>
  <ellipse cx="10" cy="34" rx="2" ry="3" fill="#c8921a" transform="rotate(-35 10 34)"/>
  <ellipse cx="14" cy="34" rx="2" ry="3" fill="#c8921a" transform="rotate(35 14 34)"/>

  <!-- Wheat stalks (right) -->
  <line x1="52" y1="48" x2="52" y2="34" stroke="#d4a017" stroke-width="1.5" stroke-linecap="round"/>
  <ellipse cx="52" cy="31" rx="2.5" ry="4" fill="#d4a017" transform="rotate(15 52 31)"/>
  <ellipse cx="50" cy="34" rx="2" ry="3" fill="#c8921a" transform="rotate(-35 50 34)"/>
  <ellipse cx="54" cy="34" rx="2" ry="3" fill="#c8921a" transform="rotate(35 54 34)"/>

  <!-- House body -->
  <rect x="20" y="36" width="24" height="16" rx="1" fill="#f0fdf4"/>

  <!-- Door -->
  <rect x="28" y="42" width="8" height="10" rx="1" fill="#064e3b"/>

  <!-- Roof (triangle) -->
  <polygon points="16,37 32,22 48,37" fill="#d4a017"/>
  <polygon points="18,37 32,24 46,37" fill="#b8860b"/>

  <!-- Minaret / tower (small mosque dome hint on top of roof) -->
  <rect x="30" y="14" width="4" height="8" rx="1" fill="#d4a017"/>
  <ellipse cx="32" cy="14" rx="4" ry="3" fill="#f0c040"/>
  <!-- Crescent on top -->
  <circle cx="32" cy="10" r="2.5" fill="#d4a017"/>
  <circle cx="33.5" cy="9.5" r="1.8" fill="#064e3b"/>

  <!-- Windows -->
  <rect x="22" y="38" width="5" height="5" rx="0.5" fill="#d4a017" opacity="0.9"/>
  <rect x="37" y="38" width="5" height="5" rx="0.5" fill="#d4a017" opacity="0.9"/>

  <!-- Ground line -->
  <rect x="10" y="51" width="44" height="2" rx="1" fill="#16a34a" opacity="0.6"/>
</svg>